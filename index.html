<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Studio - Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <i class="fas fa-cube"></i>
        <h1>GD Studio</h1>
      </div>
      <nav class="main-nav">
        <a href="dashboard.html" class="nav-link active">Mis Proyectos</a>
        <a href="#" class="nav-link">Tutoriales</a>
        <a href="#" class="nav-link">Comunidad</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="user-menu">
        <img src="assets/images/default-avatar.png" alt="Avatar" class="user-avatar" id="userAvatar">
        <span id="userName">Usuario</span>
        <button id="logoutBtn" class="btn-icon">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-main">
    <!-- Action Buttons -->
    <div class="dashboard-actions">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Buscar proyectos..." id="searchInput">
      </div>
      <div class="action-buttons">
        <button class="btn btn-primary" id="createProjectBtn">
          <i class="fas fa-plus"></i> Crear Nivel
        </button>
        <button class="btn btn-secondary" id="importProjectBtn">
          <i class="fas fa-file-import"></i> Importar Nivel
        </button>
        <input type="file" id="importFileInput" accept=".gmd,.json" style="display: none;">
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="manual">Manual</button>
      <button class="filter-btn" data-filter="ia">🤖 IA</button>
      <select class="sort-select" id="sortSelect">
        <option value="recent">Más recientes</option>
        <option value="oldest">Más antiguos</option>
        <option value="name">Nombre</option>
        <option value="objects">Más objetos</option>
      </select>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid">
      <!-- Projects loaded dynamically -->
    </div>
  </main>

  <!-- Create Project Modal -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Crear Nuevo Nivel</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="projectName">Nombre del Nivel</label>
          <input type="text" id="projectName" placeholder="Mi Nivel Increíble" required>
        </div>
        
        <div class="form-group">
          <label for="projectDifficulty">Dificultad</label>
          <select id="projectDifficulty">
            <option value="easy">⭐ Fácil</option>
            <option value="normal">⭐⭐ Normal</option>
            <option value="hard">⭐⭐⭐ Difícil</option>
            <option value="harder">⭐⭐⭐⭐ Más Difícil</option>
            <option value="insane">⭐⭐⭐⭐⭐ Insane</option>
            <option value="demon">👿 Demon</option>
          </select>
        </div>

        <div class="form-group">
          <label for="audioFile">Archivo de Audio (MP3/WAV)</label>
          <div class="file-input-wrapper">
            <input type="file" id="audioFile" accept="audio/*">
            <label for="audioFile" class="file-label">
              <i class="fas fa-music"></i> Seleccionar Audio
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="newgroundsId">ID de Newgrounds (opcional)</label>
          <input type="text" id="newgroundsId" placeholder="Ej: 123456">
        </div>

        <div class="modal-actions">
          <button class="btn btn-primary" id="createManualBtn">
            <i class="fas fa-hand-pointer"></i> Crear Manual
          </button>
          <button class="btn btn-ai" id="createIABtn">
            <i class="fas fa-robot"></i> Crear con IA
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>&copy; 2024 GD Studio. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
