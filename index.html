<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Studio - Creador de Niveles Geometry Dash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pantalla de Carga -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader">
            <i class="fas fa-cube fa-spin"></i>
            <p>Cargando GD Studio...</p>
        </div>
    </div>

    <!-- Pantalla de Auth -->
    <div id="auth-screen" class="auth-screen hidden">
        <div class="auth-container">
            <div class="auth-header">
                <h1><i class="fas fa-cube"></i> GD Studio</h1>
                <p>Crea niveles increíbles para Geometry Dash</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <!-- Formulario de Login -->
            <form id="login-form" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                </div>
                <div class="g-recaptcha" data-sitekey="6Lcvg_csAAAAAG04uFPIYKDOk2fmWJCqANM5n7W6"></div>
                <button type="submit" class="auth-btn">Iniciar Sesión</button>
                <button type="button" class="forgot-password" id="forgot-password-btn">¿Olvidaste tu contraseña?</button>
                <div class="divider"><span>o</span></div>
                <button type="button" class="google-btn" id="google-login-btn">
                    <i class="fab fa-google"></i> Continuar con Google
                </button>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="register-name" placeholder="Nombre de usuario" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="register-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="register-password" placeholder="Contraseña" required>
                </div>
                <div class="g-recaptcha" data-sitekey="6Lcvg_csAAAAAG04uFPIYKDOk2fmWJCqANM5n7W6"></div>
                <button type="submit" class="auth-btn">Registrarse</button>
                <div class="divider"><span>o</span></div>
                <button type="button" class="google-btn" id="google-register-btn">
                    <i class="fab fa-google"></i> Registrarse con Google
                </button>
            </form>

            <!-- Recuperar Contraseña -->
            <div id="forgot-password-form" class="auth-form hidden">
                <h2>Recuperar Contraseña</h2>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reset-email" placeholder="Email" required>
                </div>
                <button type="button" class="auth-btn" id="reset-password-btn">Enviar Link</button>
                <button type="button" class="back-to-login" id="back-to-login-btn">Volver al Login</button>
            </div>
        </div>
    </div>

    <!-- Pantalla Principal -->
    <div id="main-screen" class="main-screen hidden">
        <header class="main-header">
            <div class="header-left">
                <h1><i class="fas fa-cube"></i> GD Studio</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="user-profile-btn">
                    <i class="fas fa-user-circle"></i>
                </button>
                <button class="icon-btn" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <div class="projects-header">
            <h2>Mis Proyectos</h2>
            <div class="action-buttons">
                <button class="primary-btn" id="create-level-btn">
                    <i class="fas fa-plus"></i> Crear Nivel
                </button>
                <button class="secondary-btn" id="import-level-btn">
                    <i class="fas fa-file-import"></i> Importar Nivel
                </button>
            </div>
        </div>

        <div id="projects-grid" class="projects-grid">
            <!-- Los proyectos se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Pop-up Crear Nivel -->
    <div id="create-level-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Crear Nuevo Nivel</h2>
            <div class="create-options">
                <button class="option-card" id="manual-create">
                    <i class="fas fa-hand-pointer"></i>
                    <h3>Manual</h3>
                    <p>Crea tu nivel objeto por objeto</p>
                </button>
                <button class="option-card" id="ai-create">
                    <i class="fas fa-robot"></i>
                    <h3>IA + Manual</h3>
                    <p>La IA genera un nivel base que puedes editar</p>
                </button>
            </div>
            <button class="close-modal-btn">&times;</button>
        </div>
    </div>

    <!-- Modal Configuración de Nivel -->
    <div id="level-config-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="level-config-title">Configurar Nivel</h2>
            <form id="level-config-form">
                <div class="input-group">
                    <label>Nombre del Nivel</label>
                    <input type="text" id="level-name" required>
                </div>
                <div class="input-group">
                    <label>Dificultad</label>
                    <select id="level-difficulty" required>
                        <option value="easy">Easy</option>
                        <option value="normal">Normal</option>
                        <option value="hard">Hard</option>
                        <option value="harder">Harder</option>
                        <option value="insane">Insane</option>
                        <option value="demon">Demon</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Audio del Dispositivo</label>
                    <input type="file" id="level-audio" accept="audio/*">
                </div>
                <div class="input-group">
                    <label>ID de Newgrounds (opcional)</label>
                    <input type="text" id="level-ng-id" placeholder="Ej: 123456">
                </div>
                <button type="submit" class="primary-btn">Crear Nivel</button>
            </form>
            <button class="close-modal-btn">&times;</button>
        </div>
    </div>

    <!-- Modal Importar Nivel -->
    <div id="import-level-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Importar Nivel</h2>
            <div class="import-options">
                <div class="import-zone" id="import-gmd">
                    <i class="fas fa-file-upload"></i>
                    <p>Arrastra un archivo .gmd aquí</p>
                    <input type="file" accept=".gmd" hidden>
                </div>
                <div class="import-zone" id="import-json">
                    <i class="fas fa-code"></i>
                    <p>Arrastra un archivo .json aquí</p>
                    <input type="file" accept=".json" hidden>
                </div>
            </div>
            <button class="close-modal-btn">&times;</button>
        </div>
    </div>

    <!-- Editor de Niveles -->
    <div id="editor-screen" class="editor-screen hidden">
        <div class="editor-toolbar">
            <div class="toolbar-left">
                <button class="tool-btn" id="back-to-projects">
                    <i class="fas fa-arrow-left"></i> Volver
                </button>
                <h3 id="editor-level-name"></h3>
            </div>
            <div class="toolbar-center">
                <button class="tool-btn" data-tool="select">
                    <i class="fas fa-mouse-pointer"></i>
                </button>
                <button class="tool-btn" data-tool="block">
                    <i class="fas fa-square"></i>
                </button>
                <button class="tool-btn" data-tool="spike">
                    <i class="fas fa-exclamation-triangle"></i>
                </button>
                <button class="tool-btn" data-tool="orb">
                    <i class="fas fa-circle"></i>
                </button>
                <button class="tool-btn" data-tool="portal">
                    <i class="fas fa-door-open"></i>
                </button>
                <button class="tool-btn" data-tool="erase">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>
            <div class="toolbar-right">
                <button class="tool-btn" id="test-level-btn">
                    <i class="fas fa-play"></i> Testear
                </button>
                <button class="tool-btn" id="save-level-btn">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <button class="tool-btn" id="export-level-btn">
                    <i class="fas fa-download"></i> Exportar
                </button>
            </div>
        </div>
        <div class="editor-container">
            <canvas id="editor-canvas"></canvas>
        </div>
        <div class="editor-sidebar" id="editor-sidebar">
            <h4>Propiedades</h4>
            <div id="object-properties"></div>
        </div>
    </div>

    <!-- Player de Prueba -->
    <div id="player-screen" class="player-screen hidden">
        <div class="player-header">
            <button class="tool-btn" id="stop-test-btn">
                <i class="fas fa-stop"></i> Detener
            </button>
            <div class="player-stats">
                <span id="player-attempts">Intentos: 0</span>
                <span id="player-progress">Progreso: 0%</span>
            </div>
        </div>
        <canvas id="player-canvas"></canvas>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="database.js"></script>
    <script src="editor.js"></script>
    <script src="player.js"></script>
    <script src="ai-generator.js"></script>
    <script src="export-import.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
