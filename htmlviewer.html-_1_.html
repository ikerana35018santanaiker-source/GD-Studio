<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Counter Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f1724, #1e293b); font-family: Inter, sans-serif; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff0000; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .banner { width: 100%; border-radius: 12px 12px 0 0; object-fit: cover; }
    .thumbnail { width: 100%; border-radius: 12px; }
    iframe { width: 100%; border-radius: 12px; }
  </style>
</head>
<body class="h-screen flex items-center justify-center">

  <div id="loader" class="fixed inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center z-50">
    <div class="spinner mb-4"></div>
    <div class="text-white text-xl">Cargando...</div>
  </div>

  <div id="app" class="hidden flex-col items-center w-full max-w-3xl mx-auto p-6 space-y-6">

    <header class="flex items-center gap-3 text-white">
      <img src="https://www.youtube.com/s/desktop/3f3b3af1/img/favicon_32x32.png" alt="YouTube" class="w-8 h-8">
      <h1 class="text-2xl font-bold">YouTube Live Counter Pro</h1>
    </header>

    <div class="glass p-6 w-full flex flex-col md:flex-row md:items-center gap-4">
      <select id="searchType" class="p-2 rounded bg-white bg-opacity-10 text-white border border-white border-opacity-20">
        <option value="channel">Canal (@nombre o ID)</option>
        <option value="video">Video (link)</option>
        <option value="short">Short (link)</option>
      </select>
      <input id="searchInput" placeholder="@canal o link" class="p-2 rounded w-full md:w-2/3 bg-white bg-opacity-10 text-white border border-white border-opacity-20">
      <button id="searchBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold">Buscar</button>
    </div>

    <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full"></div>

  </div>

  <script>
    const API_KEY = 'AIzaSyAVtYjBzWvcOf7tZTS1rbvEIH4idQAJCPc';

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
      }, 10000);
    });

    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('results');

    function animateCount(el, end) {
      const start = 0;
      const duration = 1000;
      let startTime = null;
      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        el.textContent = Math.floor(progress * (end - start) + start).toLocaleString();
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    async function fetchChannelStats(channelId) {
      const resp = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet,brandingSettings&id=${channelId}&key=${API_KEY}`);
      const data = await resp.json();
      if (!data.items || !data.items.length) throw new Error('Canal no encontrado');
      return data.items[0];
    }

    async function fetchVideoStats(videoId) {
      const resp = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails,snippet&id=${videoId}&key=${API_KEY}`);
      const data = await resp.json();
      if (!data.items || !data.items.length) throw new Error('Video no encontrado');
      return data.items[0];
    }

    async function resolveChannelId(input) {
      if (input.startsWith('@')) {
        const resp = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=${input}&key=${API_KEY}`);
        const data = await resp.json();
        if (!data.items || !data.items.length) throw new Error('Canal no encontrado');
        return data.items[0].snippet.channelId;
      }
      return input;
    }

    searchBtn.addEventListener('click', async () => {
      const type = document.getElementById('searchType').value;
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return alert('Introduce un canal o enlace');

      resultsDiv.innerHTML = '<div class="glass p-6 text-white">Cargando...</div>';

      try {
        if (type === 'channel') {
          const channelId = await resolveChannelId(input);
          const channel = await fetchChannelStats(channelId);
          const stats = channel.statistics;
          const snippet = channel.snippet;
          const bannerUrl = channel.brandingSettings?.image?.bannerExternalUrl || '';
          resultsDiv.innerHTML = `
            <div class="glass p-6 text-white space-y-2">
              ${bannerUrl ? `<img src='${bannerUrl}' class='banner mb-4' alt='Banner'>` : ''}
              <div class='flex items-center gap-3'>
                <img src='${snippet.thumbnails.default.url}' class='w-16 h-16 rounded-full' alt='Icono'>
                <h2 class='text-xl font-bold'>${snippet.title}</h2>
              </div>
              <div>Suscriptores: <b id="subs"></b></div>
              <div>Videos: <b id="videosCount"></b></div>
              <div>Vistas totales: <b id="viewsTotal"></b></div>
            </div>
          `;
          animateCount(document.getElementById('subs'), Number(stats.subscriberCount));
          animateCount(document.getElementById('videosCount'), Number(stats.videoCount));
          animateCount(document.getElementById('viewsTotal'), Number(stats.viewCount));

        } else if (type === 'video' || type === 'short') {
          const videoIdMatch = input.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
          if (!videoIdMatch) throw new Error('ID de video inválido');
          const videoId = videoIdMatch[1];
          const video = await fetchVideoStats(videoId);
          const stats = video.statistics;
          const snippet = video.snippet;
          const duration = video.contentDetails.duration;

          resultsDiv.innerHTML = `
            <div class="glass p-6 text-white space-y-2">
              <h2 class='text-xl font-bold'>${snippet.title}</h2>
              <iframe src='https://www.youtube.com/embed/${videoId}' height='315' allowfullscreen></iframe>
              <div>Vistas: <b id="views"></b></div>
              <div>Likes: <b id="likes"></b></div>
              <div>Duración: <b>${duration}</b></div>
            </div>
          `;
          animateCount(document.getElementById('views'), Number(stats.viewCount));
          animateCount(document.getElementById('likes'), Number(stats.likeCount || 0));
        }
      } catch (err) {
        resultsDiv.innerHTML = `<div class="glass p-6 text-red-500">Error: ${err.message}</div>`;
      }
    });
  </script>

</body>
</html>
